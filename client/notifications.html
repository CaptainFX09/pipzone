    <!-- ====================================================================
         Notifications Modal / Centered Popup
    ==================================================================== -->
    <div id="notifModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="notifModalTitle">
      <div class="modal-card notif-modal-card">
        <div class="modal-header">
          <div class="modal-header-left">
            <h3 class="modal-title" id="notifModalTitle">Trading Desk Notifications</h3>
            <span class="modal-badge mono" id="notifTotalBadge">0 new</span>
          </div>
          <button class="modal-close-btn" id="closeNotifBtn" aria-label="Close notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <div class="notif-controls-row">
          <div class="notif-tabs">
            <button class="notif-tab active" data-tab="all">All</button>
            <button class="notif-tab" data-tab="settlements">Settlements</button>
            <button class="notif-tab" data-tab="security">Security</button>
          </div>
          <button class="text-link-btn" id="markAllReadBtn">Mark all as read</button>
        </div>

        <div class="notif-body-scroll" id="notifListContainer">
          <!-- Populated by script.js with Today / Yesterday / Earlier grouping -->
        </div>
      </div>
    </div>
