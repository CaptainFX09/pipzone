<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PipZoNe — Trade Code</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="profit-codes.css">
</head>
<body>
<div class="container">
<div class="header">
<div>
<h1>Pip<span>ZoNe</span></h1>
<p>Trade Code</p>
</div>
<div class="header-buttons">
<button class="back-btn" onclick="location.href='announcements.html'" type="button">📢 Announcements</button>
<button class="back-btn" type="button" onclick="location.href='index.html'">Dashboard</button>
<button class="logout-btn" id="logoutBtn" type="button">Logout</button>
</div>
</div>

<div class="card">
<div class="card-title">Generate Trade Code</div>
<div class="card-sub">Create a one-time code for a specific client. The server controls expiry, balance limits and one-time use.</div>

<div class="field">
<label for="adjustmentType">Adjustment Type</label>
<select id="adjustmentType">
<option value="increase">Increase</option>
<option value="decrease">Decrease</option>
</select>
</div>

<div class="field">
<label for="percentage">Adjustment Percentage</label>
<input id="percentage" type="number" min="0.01" max="100" step="0.01" placeholder="e.g. 1.50">
</div>

<div class="field full">
<label for="expiryValue">Code Expiry Time</label>
<div class="expiry-row">
<input id="expiryValue" type="number" min="1" step="1" placeholder="e.g. 10">
<select id="expiryUnit">
<option value="minutes">Minutes</option>
<option value="hours">Hours</option>
<option value="days">Days</option>
</select>
</div>
</div>
</div>

<div class="generated-row">
<div class="field">
<label for="generatedCode">Generated Code</label>
<input id="generatedCode" type="text" readonly placeholder="PZ-TRD-000001">
</div>
<button id="generateBtn" class="generate-btn" type="button">Generate Code</button>
</div>
<div id="message" class="message"></div>
</div>

<div class="history card">
<div class="history-head">
<div>
<div class="card-title">Generated Codes History</div>
<div class="card-sub">Stored in Supabase. Test records can be deleted from here.</div>
</div>
<button id="refreshBtn" class="back-btn" type="button">Refresh</button>
</div>
<div id="historyList"><div class="empty">Loading...</div></div>
</div>
</div>
<script src="profit-codes.js"></script>
</body>
</html>
